<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">cTAKES USDHUB clinical NLP</title>
  <desc id="desc">The fictional phrase No fever stays attached to characters 85 to 90 while cTAKES adds candidate DEMO-C002 and a negated assertion. Batch 1 completed 1,708,157 notes and produced 142,891,564 concept rows plus 11,004,425 medication candidate rows.</desc>
  <style>
    svg {
      --paper: #F4F4F2;
      --sheet: #FFFFFF;
      --ink: #161617;
      --blue-text: #3155B4;
      --coral-text: #B03E18;
      --muted: #5E5E62;
      --line: #DEDEDA;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #111113;
        --sheet: #1B1B1F;
        --ink: #F2F2F0;
        --blue-text: #8AA5FF;
        --coral-text: #FFA485;
        --muted: #B8B8BC;
        --line: #36363A;
      }
    }
    .ui { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 1.5px; }
    .display { font-size: 38px; font-weight: 600; letter-spacing: -0.8px; }
    .body { font-size: 18px; font-weight: 400; }
    .note { font-size: 16px; font-weight: 400; }
    .stat { font-size: 30px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
  </style>

  <rect x="1" y="1" width="998" height="418" rx="14" fill="var(--paper)" />
  <path d="M28 64H972" stroke="var(--line)" />
  <path d="M620 88V390" stroke="var(--line)" />

  <text class="ui label" x="36" y="42" fill="var(--ink)">cTAKES USDHUB</text>
  <text class="ui label" x="964" y="42" text-anchor="end" fill="var(--blue-text)">CLINICAL NLP · RELEASE 2.1.19</text>

  <g transform="translate(40 104)">
    <text class="ui label" x="0" y="0" fill="var(--muted)">ONE SYNTHETIC NOTE</text>
    <text class="ui display" x="0" y="58" fill="var(--blue-text)">Clinical text becomes</text>
    <text class="ui display" x="0" y="104" fill="var(--ink)">reviewable rows.</text>
    <text class="ui body" x="0" y="145" fill="var(--muted)">cTAKES keeps the source words and adds coded fields around them.</text>

    <rect x="0" y="174" width="536" height="104" rx="12" fill="var(--sheet)" />
    <text class="ui label" x="18" y="204" fill="var(--muted)">NOTE</text>
    <text class="ui body" x="112" y="205" fill="var(--ink)">“No fever.”</text>
    <path d="M18 226H518" stroke="var(--line)" />
    <text class="ui label" x="18" y="258" fill="var(--muted)">ROW</text>
    <text class="ui body" x="112" y="259" fill="var(--ink)">fever · 85–90 · DEMO-C002 · </text>
    <text class="ui body" x="384" y="259" fill="var(--coral-text)">negated</text>
  </g>

  <text class="ui note" x="40" y="392" fill="var(--blue-text)">structure → dictionary → WSD → Drug NER → context → SQLite + CSV</text>

  <g transform="translate(660 104)">
    <text class="ui label" x="0" y="0" fill="var(--blue-text)">BATCH 1</text>
    <text class="ui stat" x="0" y="52" fill="var(--blue-text)">1,708,157</text>
    <text class="ui body" x="0" y="78" fill="var(--muted)">notes completed in 9h 47m</text>
    <path d="M0 106H304" stroke="var(--line)" />

    <text class="ui stat" x="0" y="157" fill="var(--ink)">142,891,564</text>
    <text class="ui note" x="0" y="183" fill="var(--muted)">concept rows</text>

    <text class="ui stat" x="0" y="235" fill="var(--ink)">11,004,425</text>
    <text class="ui note" x="0" y="261" fill="var(--muted)">medication candidate rows</text>

  </g>
</svg>
