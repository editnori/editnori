<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
  <title id="title">Editnori</title>
  <desc id="desc">A compact animated Editnori wordmark above a three-step build console for small screens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12" />
      <stop offset="0.55" stop-color="#0B1221" />
      <stop offset="1" stop-color="#11182A" />
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE4C7" />
      <stop offset="0.48" stop-color="#8CD7FF" />
      <stop offset="1" stop-color="#9D7CFF" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE4C7" stop-opacity="0" />
      <stop offset="0.5" stop-color="#5DE4C7" />
      <stop offset="1" stop-color="#9D7CFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#5DE4C7" stop-opacity="0.22" />
      <stop offset="1" stop-color="#5DE4C7" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#AFC4E8" stroke-opacity="0.06" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .flow { stroke-dasharray: 6 15; animation: flow 6s linear infinite; }
    .pulse-1 { animation: pulse 3.6s 0s ease-in-out infinite; }
    .pulse-2 { animation: pulse 3.6s 1.2s ease-in-out infinite; }
    .pulse-3 { animation: pulse 3.6s 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .orb { animation: orb 8s ease-in-out infinite; transform-origin: center; }
    @keyframes flow { to { stroke-dashoffset: -180; } }
    @keyframes pulse { 0%, 100% { opacity: .48; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes orb { 0%, 100% { transform: translate(-18px, 10px) scale(.9); } 50% { transform: translate(24px, -12px) scale(1.16); } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse-1, .pulse-2, .pulse-3, .cursor, .orb { animation: none !important; opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="718" height="858" rx="28" fill="url(#background)" stroke="#B7C9E8" stroke-opacity="0.16" stroke-width="2" />
  <rect x="1" y="1" width="718" height="858" rx="28" fill="url(#grid)" />
  <circle class="orb" cx="92" cy="74" r="250" fill="url(#orb)" />

  <g transform="translate(42 44)">
    <rect width="188" height="34" rx="17" fill="#5DE4C7" fill-opacity="0.09" stroke="#5DE4C7" stroke-opacity="0.3" />
    <circle cx="20" cy="17" r="5" fill="#5DE4C7" />
    <text class="mono" x="36" y="23" font-size="14" letter-spacing="1.7" fill="#B9D8D1">EDITNORI / 01</text>
  </g>

  <text class="sans" x="40" y="180" font-size="74" font-weight="760" letter-spacing="7" fill="url(#wordmark)">EDITNORI</text>
  <text class="sans" x="43" y="226" font-size="25" font-weight="560" fill="#EAF2FF">software that explains its work<tspan class="cursor" fill="#5DE4C7">_</tspan></text>
  <text class="mono" x="43" y="268" font-size="14" letter-spacing="1.7" fill="#8193B2">CLINICAL SYSTEMS / LOCAL AI / AGENTS</text>

  <path d="M44 316C188 276 332 350 474 312S612 300 676 282" fill="none" stroke="#2A3851" stroke-width="3" />
  <path class="flow" d="M44 316C188 276 332 350 474 312S612 300 676 282" fill="none" stroke="url(#signal)" stroke-width="4" filter="url(#glow)" />

  <g transform="translate(40 358)">
    <rect width="640" height="410" rx="24" fill="#090E1A" fill-opacity="0.88" stroke="#91A8CC" stroke-opacity="0.2" />
    <path d="M0 58H640" stroke="#91A8CC" stroke-opacity="0.14" />
    <circle cx="24" cy="29" r="6" fill="#FF6B7A" />
    <circle cx="48" cy="29" r="6" fill="#FFB86C" />
    <circle cx="72" cy="29" r="6" fill="#5DE4C7" />
    <text class="mono" x="98" y="35" font-size="15" fill="#8292AD">~/editnori/build-loop</text>

    <g class="pulse-1" transform="translate(28 88)">
      <text class="mono" x="0" y="22" font-size="15" fill="#5DE4C7">01</text>
      <text class="mono" x="46" y="22" font-size="15" letter-spacing="1.8" fill="#AEBED8">INPUT</text>
      <text class="sans" x="46" y="56" font-size="21" fill="#F0F5FF">free-form language</text>
      <path d="M0 82H584" stroke="#91A8CC" stroke-opacity="0.13" />
    </g>

    <g class="pulse-2" transform="translate(28 190)">
      <text class="mono" x="0" y="22" font-size="15" fill="#8CD7FF">02</text>
      <text class="mono" x="46" y="22" font-size="15" letter-spacing="1.8" fill="#AEBED8">CHECK</text>
      <text class="sans" x="46" y="56" font-size="21" fill="#F0F5FF">evidence + constraints</text>
      <path d="M0 82H584" stroke="#91A8CC" stroke-opacity="0.13" />
    </g>

    <g class="pulse-3" transform="translate(28 292)">
      <text class="mono" x="0" y="22" font-size="15" fill="#9D7CFF">03</text>
      <text class="mono" x="46" y="22" font-size="15" letter-spacing="1.8" fill="#AEBED8">RETURN</text>
      <text class="sans" x="46" y="56" font-size="21" fill="#F0F5FF">structured, usable result</text>
    </g>
  </g>

  <text class="mono" x="42" y="815" font-size="14" fill="#62728D">LAYTH QASSEM · PHARMD, MS</text>
  <circle class="pulse-1" cx="646" cy="810" r="6" fill="#5DE4C7" filter="url(#glow)" />
</svg>
