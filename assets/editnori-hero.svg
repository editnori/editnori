<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Editnori</title>
  <desc id="desc">An animated Editnori wordmark beside a compact build console. The console carries an input through a check and returns a usable result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12" />
      <stop offset="0.55" stop-color="#0B1221" />
      <stop offset="1" stop-color="#11182A" />
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE4C7" />
      <stop offset="0.48" stop-color="#8CD7FF" />
      <stop offset="1" stop-color="#9D7CFF" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE4C7" stop-opacity="0" />
      <stop offset="0.5" stop-color="#5DE4C7" />
      <stop offset="1" stop-color="#9D7CFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="green-orb">
      <stop offset="0" stop-color="#5DE4C7" stop-opacity="0.26" />
      <stop offset="1" stop-color="#5DE4C7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-orb">
      <stop offset="0" stop-color="#9D7CFF" stop-opacity="0.24" />
      <stop offset="1" stop-color="#9D7CFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#AFC4E8" stroke-opacity="0.065" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="518" rx="28" />
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .signal-path { stroke-dasharray: 6 16; animation: signal-flow 7s linear infinite; }
    .scan { animation: scan 8s ease-in-out infinite; }
    .orb-a { animation: orb-a 9s ease-in-out infinite; transform-origin: center; }
    .orb-b { animation: orb-b 11s ease-in-out infinite; transform-origin: center; }
    .node-a { animation: node 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-b { animation: node 3.6s 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-c { animation: node 3.6s 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .status { animation: status 2.4s ease-in-out infinite; }
    @keyframes signal-flow { to { stroke-dashoffset: -220; } }
    @keyframes scan { 0%, 10% { transform: translateY(-180px); opacity: 0; } 35% { opacity: .45; } 80%, 100% { transform: translateY(650px); opacity: 0; } }
    @keyframes orb-a { 0%, 100% { transform: translate(-14px, 8px) scale(.9); opacity: .65; } 50% { transform: translate(28px, -16px) scale(1.15); opacity: 1; } }
    @keyframes orb-b { 0%, 100% { transform: translate(12px, -6px) scale(1); opacity: .7; } 50% { transform: translate(-24px, 18px) scale(1.18); opacity: 1; } }
    @keyframes node { 0%, 100% { transform: scale(1); opacity: .72; } 50% { transform: scale(1.35); opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes status { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .signal-path, .scan, .orb-a, .orb-b, .node-a, .node-b, .node-c, .cursor, .status { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="url(#background)" />
    <rect width="1200" height="520" fill="url(#grid)" />
    <circle class="orb-a" cx="126" cy="72" r="280" fill="url(#green-orb)" />
    <circle class="orb-b" cx="1082" cy="436" r="330" fill="url(#purple-orb)" />
    <rect class="scan" x="0" y="-120" width="1200" height="92" fill="url(#signal)" opacity="0.18" />

    <g transform="translate(66 58)">
      <rect width="172" height="30" rx="15" fill="#5DE4C7" fill-opacity="0.09" stroke="#5DE4C7" stroke-opacity="0.28" />
      <circle cx="18" cy="15" r="4" fill="#5DE4C7" />
      <text class="mono" x="31" y="20" font-size="12" letter-spacing="1.6" fill="#B9D8D1">EDITNORI / 01</text>
    </g>

    <text class="sans" x="62" y="202" font-size="88" font-weight="760" letter-spacing="9" fill="url(#wordmark)">EDITNORI</text>
    <text class="sans" x="68" y="249" font-size="25" font-weight="560" letter-spacing="0.4" fill="#EAF2FF">software that explains its work<tspan class="cursor" fill="#5DE4C7">_</tspan></text>
    <text class="mono" x="69" y="291" font-size="13" letter-spacing="2.4" fill="#8193B2">CLINICAL INFORMATICS  /  LOCAL-FIRST AI  /  AGENT INFRASTRUCTURE</text>

    <path d="M70 346 C220 310 358 385 514 348 S654 334 714 318" fill="none" stroke="#22304B" stroke-width="2" />
    <path class="signal-path" d="M70 346 C220 310 358 385 514 348 S654 334 714 318" fill="none" stroke="url(#signal)" stroke-width="3" filter="url(#glow)" />
    <g>
      <circle class="node-a" cx="156" cy="335" r="5" fill="#5DE4C7" />
      <circle class="node-b" cx="386" cy="364" r="5" fill="#8CD7FF" />
      <circle class="node-c" cx="624" cy="330" r="5" fill="#9D7CFF" />
    </g>

    <g transform="translate(68 398)">
      <text class="mono" x="0" y="0" font-size="12" letter-spacing="1.8" fill="#5DE4C7">BUILD</text>
      <rect x="60" y="-8" width="54" height="1" fill="#33425D" />
      <text class="mono" x="132" y="0" font-size="12" letter-spacing="1.8" fill="#8CD7FF">VERIFY</text>
      <rect x="210" y="-8" width="54" height="1" fill="#33425D" />
      <text class="mono" x="282" y="0" font-size="12" letter-spacing="1.8" fill="#9D7CFF">SHIP</text>
    </g>
    <text class="mono" x="68" y="459" font-size="12" fill="#62728D">LAYTH QASSEM · PHARMD, MS</text>

    <g transform="translate(742 58)">
      <rect width="408" height="404" rx="22" fill="#090E1A" fill-opacity="0.84" stroke="#91A8CC" stroke-opacity="0.18" />
      <path d="M0 52H408" stroke="#91A8CC" stroke-opacity="0.13" />
      <circle cx="22" cy="26" r="5" fill="#FF6B7A" />
      <circle cx="42" cy="26" r="5" fill="#FFB86C" />
      <circle cx="62" cy="26" r="5" fill="#5DE4C7" />
      <text class="mono" x="88" y="31" font-size="12" fill="#8292AD">~/editnori/build-loop</text>

      <g transform="translate(24 84)">
        <text class="mono" x="0" y="18" font-size="11" fill="#5DE4C7">01</text>
        <text class="mono" x="36" y="18" font-size="11" letter-spacing="1.8" fill="#AEBED8">INPUT</text>
        <text class="sans" x="36" y="45" font-size="16" fill="#F0F5FF">free-form language</text>
        <path d="M0 66H360" stroke="#91A8CC" stroke-opacity="0.12" />
      </g>

      <g transform="translate(24 168)">
        <text class="mono" x="0" y="18" font-size="11" fill="#8CD7FF">02</text>
        <text class="mono" x="36" y="18" font-size="11" letter-spacing="1.8" fill="#AEBED8">CHECK</text>
        <text class="sans" x="36" y="45" font-size="16" fill="#F0F5FF">evidence + constraints</text>
        <path d="M0 66H360" stroke="#91A8CC" stroke-opacity="0.12" />
      </g>

      <g transform="translate(24 252)">
        <text class="mono" x="0" y="18" font-size="11" fill="#9D7CFF">03</text>
        <text class="mono" x="36" y="18" font-size="11" letter-spacing="1.8" fill="#AEBED8">RETURN</text>
        <text class="sans" x="36" y="45" font-size="16" fill="#F0F5FF">structured, usable result</text>
        <path d="M0 66H360" stroke="#91A8CC" stroke-opacity="0.12" />
      </g>

      <g transform="translate(24 350)">
        <circle class="status" cx="5" cy="5" r="5" fill="#5DE4C7" filter="url(#glow)" />
        <text class="mono" x="20" y="10" font-size="11" fill="#769087">STATUS: SHIPPING</text>
        <text class="mono" x="360" y="10" font-size="11" text-anchor="end" fill="#51617B">2026</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="none" stroke="#B7C9E8" stroke-opacity="0.16" stroke-width="2" />
</svg>
