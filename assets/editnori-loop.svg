<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="246" viewBox="0 0 1200 246" role="img" aria-labelledby="title desc">
  <title id="title">The Editnori build loop</title>
  <desc id="desc">Four connected stages show raw input becoming structure, passing an evidence check, and reaching a usable result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D17" />
      <stop offset="1" stop-color="#10182A" />
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE4C7" />
      <stop offset="0.5" stop-color="#8CD7FF" />
      <stop offset="1" stop-color="#9D7CFF" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .flow { stroke-dasharray: 5 13; animation: flow 5.5s linear infinite; }
    .stage-1 { animation: stage 4.8s 0s ease-in-out infinite; }
    .stage-2 { animation: stage 4.8s 1.2s ease-in-out infinite; }
    .stage-3 { animation: stage 4.8s 2.4s ease-in-out infinite; }
    .stage-4 { animation: stage 4.8s 3.6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -180; } }
    @keyframes stage { 0%, 72%, 100% { opacity: .52; } 18%, 42% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .stage-1, .stage-2, .stage-3, .stage-4 { animation: none !important; opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="244" rx="22" fill="url(#background)" stroke="#AFC4E8" stroke-opacity="0.14" stroke-width="2" />
  <text class="mono" x="42" y="39" font-size="11" letter-spacing="2.1" fill="#70819D">THE EDITNORI LOOP</text>
  <path d="M164 122H1035" fill="none" stroke="#2A3851" stroke-width="3" />
  <path class="flow" d="M164 122H1035" fill="none" stroke="url(#connector)" stroke-width="3" filter="url(#glow)" />

  <g class="stage-1" transform="translate(126 78)">
    <rect width="190" height="90" rx="18" fill="#0D1822" stroke="#5DE4C7" stroke-opacity="0.6" />
    <circle cx="38" cy="44" r="13" fill="#5DE4C7" fill-opacity="0.13" stroke="#5DE4C7" />
    <text class="mono" x="38" y="49" font-size="12" text-anchor="middle" fill="#5DE4C7">01</text>
    <text class="mono" x="64" y="37" font-size="11" letter-spacing="1.5" fill="#5DE4C7">INPUT</text>
    <text class="sans" x="64" y="59" font-size="14" fill="#E8F3F0">note / audio / SIG</text>
  </g>

  <g class="stage-2" transform="translate(378 78)">
    <rect width="190" height="90" rx="18" fill="#0D1624" stroke="#8CD7FF" stroke-opacity="0.6" />
    <circle cx="38" cy="44" r="13" fill="#8CD7FF" fill-opacity="0.13" stroke="#8CD7FF" />
    <text class="mono" x="38" y="49" font-size="12" text-anchor="middle" fill="#8CD7FF">02</text>
    <text class="mono" x="64" y="37" font-size="11" letter-spacing="1.5" fill="#8CD7FF">STRUCTURE</text>
    <text class="sans" x="64" y="59" font-size="14" fill="#E8F3F8">parsed facts</text>
  </g>

  <g class="stage-3" transform="translate(630 78)">
    <rect width="190" height="90" rx="18" fill="#111424" stroke="#9D7CFF" stroke-opacity="0.6" />
    <circle cx="38" cy="44" r="13" fill="#9D7CFF" fill-opacity="0.13" stroke="#9D7CFF" />
    <text class="mono" x="38" y="49" font-size="12" text-anchor="middle" fill="#B69CFF">03</text>
    <text class="mono" x="64" y="37" font-size="11" letter-spacing="1.5" fill="#B69CFF">EVIDENCE</text>
    <text class="sans" x="64" y="59" font-size="14" fill="#F0EDFA">supported / missing</text>
  </g>

  <g class="stage-4" transform="translate(882 78)">
    <rect width="190" height="90" rx="18" fill="#181522" stroke="#FFB86C" stroke-opacity="0.6" />
    <circle cx="38" cy="44" r="13" fill="#FFB86C" fill-opacity="0.13" stroke="#FFB86C" />
    <text class="mono" x="38" y="49" font-size="12" text-anchor="middle" fill="#FFB86C">04</text>
    <text class="mono" x="64" y="37" font-size="11" letter-spacing="1.5" fill="#FFB86C">RESULT</text>
    <text class="sans" x="64" y="59" font-size="14" fill="#FFF1E2">usable interface</text>
  </g>

  <text class="mono" x="42" y="216" font-size="11" fill="#5B6B86">RAW INPUT → EXPLICIT TRANSFORMATION → CHECKED OUTPUT</text>
</svg>
