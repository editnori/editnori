<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">Editnori by Layth Qassem</title>
  <desc id="desc">Active Chrome tab audio becomes live English captions because Moonshine processes the stream inside the browser. The same build path turns an input into a checked, usable result.</desc>
  <style>
    svg {
      --paper: #F6F6F4;
      --ink: #161617;
      --blue: #3155B4;
      --blue-body: #52689F;
      --coral: #FF8C66;
      --live: #36C26E;
      --muted: #5E5E62;
      --hair: #D8D8D5;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #161617;
        --ink: #F2F2F0;
        --blue: #7C9BFF;
        --blue-body: #94A8E2;
        --coral: #FF9A78;
        --live: #43D97F;
        --muted: #B8B8BC;
        --hair: #38383B;
      }
    }
    .ui { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    .label { font-size: 15px; font-weight: 600; letter-spacing: 1.8px; }
    .question { font-size: 19px; font-weight: 500; }
    .display { font-size: 43px; font-weight: 600; letter-spacing: -0.9px; }
    .answer { font-size: 25px; font-weight: 600; letter-spacing: -0.2px; }
    .body { font-size: 19px; font-weight: 400; }
    .path-line { stroke-dasharray: 180; stroke-dashoffset: 0; animation: reveal 320ms var(--ease-out) both; }
    .result { animation: arrive 320ms 120ms var(--ease-out) both; }
    @keyframes reveal { from { stroke-dashoffset: 180; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .path-line, .result { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="718" height="758" rx="16" fill="var(--paper)" stroke="var(--blue)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7" />
  <path d="M34 76H686" stroke="var(--hair)" />

  <text class="ui label" x="34" y="49" fill="var(--ink)">EDITNORI</text>
  <text class="ui label" x="686" y="49" text-anchor="end" fill="var(--blue)">LOCAL SOFTWARE</text>

  <g transform="translate(36 119)">
    <text class="ui question" x="0" y="0" fill="var(--muted)">What does one input become?</text>
    <text class="ui display" x="0" y="63" fill="var(--blue)">Tab audio becomes</text>
    <text class="ui display" x="0" y="113" fill="var(--ink)">live English captions.</text>
    <path d="M2 137C142 160 304 126 498 145" fill="none" stroke="var(--coral)" stroke-width="3" stroke-linecap="round" />
    <text class="ui body" x="0" y="181" fill="var(--blue-body)">Moonshine processes the stream inside the browser, so</text>
    <text class="ui body" x="0" y="211" fill="var(--blue-body)">the audio and transcript text stay there.</text>
  </g>

  <path d="M34 365H686" stroke="var(--hair)" />

  <g transform="translate(36 407)">
    <text class="ui label" x="0" y="0" fill="var(--blue)">THE BUILD PATH</text>

    <path class="path-line" d="M10 42V213" stroke="var(--hair)" stroke-width="2" />
    <circle cx="10" cy="54" r="6" fill="var(--blue)" />
    <circle cx="10" cy="128" r="6" fill="var(--coral)" />
    <circle class="result" cx="10" cy="202" r="6" fill="var(--live)" />

    <text class="ui label" x="40" y="49" fill="var(--muted)">INPUT</text>
    <text class="ui body" x="156" y="50" fill="var(--ink)">Active Chrome tab audio</text>
    <path d="M40 72H648" stroke="var(--hair)" />

    <text class="ui label" x="40" y="123" fill="var(--muted)">CHECK</text>
    <text class="ui body" x="156" y="124" fill="var(--ink)">Local streaming speech model</text>
    <path d="M40 146H648" stroke="var(--hair)" />

    <g class="result">
      <text class="ui label" x="40" y="197" fill="var(--muted)">RETURN</text>
      <text class="ui answer" x="156" y="200" fill="var(--ink)">Live English captions</text>
    </g>

    <path d="M0 243H648" stroke="var(--hair)" />
    <circle cx="4" cy="280" r="5" fill="var(--live)" />
    <text class="ui body" x="24" y="286" fill="var(--blue-body)">No account, analytics, transcript history, or app server.</text>
  </g>

  <text class="ui label" x="36" y="726" fill="var(--muted)">LAYTH QASSEM, PHARMD, MS</text>
</svg>
