<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880" role="img" aria-labelledby="title desc">
  <title id="title">Editnori by Layth Qassem</title>
  <desc id="desc">Active Chrome tab audio becomes live English captions because Moonshine processes the stream inside the browser. The same build path turns an input into a checked, usable result.</desc>
  <style>
    svg {
      --paper: #F6F6F4;
      --ink: #161617;
      --blue: #3155B4;
      --blue-body: #52689F;
      --coral: #FF8C66;
      --live: #36C26E;
      --muted: #5E5E62;
      --hair: #D8D8D5;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #161617;
        --ink: #F2F2F0;
        --blue: #7C9BFF;
        --blue-body: #94A8E2;
        --coral: #FF9A78;
        --live: #43D97F;
        --muted: #B8B8BC;
        --hair: #38383B;
      }
    }
    .ui { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    .brand { font-size: 24px; font-weight: 600; letter-spacing: 1.7px; }
    .label { font-size: 24px; font-weight: 600; letter-spacing: 1.5px; }
    .question { font-size: 24px; font-weight: 500; }
    .display { font-size: 42px; font-weight: 600; letter-spacing: -0.8px; }
    .answer { font-size: 28px; font-weight: 600; letter-spacing: -0.2px; }
    .body { font-size: 24px; font-weight: 400; }
    .note { font-size: 23px; font-weight: 400; }
    .path-line { stroke-dasharray: 180; stroke-dashoffset: 0; animation: reveal 320ms var(--ease-out) both; }
    .result { animation: arrive 320ms 120ms var(--ease-out) both; }
    @keyframes reveal { from { stroke-dashoffset: 180; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .path-line, .result { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="598" height="878" rx="14" fill="var(--paper)" stroke="var(--blue)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7" />
  <path d="M30 74H570" stroke="var(--hair)" />

  <text class="ui brand" x="30" y="48" fill="var(--ink)">EDITNORI</text>
  <text class="ui brand" x="570" y="48" text-anchor="end" fill="var(--blue)">LOCAL SOFTWARE</text>

  <g transform="translate(30 118)">
    <text class="ui question" x="0" y="0" fill="var(--muted)">What does one input become?</text>
    <text class="ui display" x="0" y="64" fill="var(--blue)">Tab audio becomes</text>
    <text class="ui display" x="0" y="114" fill="var(--ink)">live English captions.</text>
    <path d="M2 138C126 159 266 127 466 146" fill="none" stroke="var(--coral)" stroke-width="3" stroke-linecap="round" />
    <text class="ui body" x="0" y="183" fill="var(--blue-body)">Moonshine processes the stream</text>
    <text class="ui body" x="0" y="218" fill="var(--blue-body)">inside the browser, so the audio and</text>
    <text class="ui body" x="0" y="253" fill="var(--blue-body)">transcript text stay there.</text>
  </g>

  <path d="M30 405H570" stroke="var(--hair)" />

  <g transform="translate(30 450)">
    <text class="ui label" x="0" y="0" fill="var(--blue)">THE BUILD PATH</text>

    <path class="path-line" d="M10 46V228" stroke="var(--hair)" stroke-width="2" />
    <circle cx="10" cy="58" r="7" fill="var(--blue)" />
    <circle cx="10" cy="140" r="7" fill="var(--coral)" />
    <circle class="result" cx="10" cy="222" r="7" fill="var(--live)" />

    <text class="ui label" x="42" y="54" fill="var(--muted)">INPUT</text>
    <text class="ui body" x="164" y="56" fill="var(--ink)">Active Chrome tab audio</text>
    <path d="M42 82H540" stroke="var(--hair)" />

    <text class="ui label" x="42" y="136" fill="var(--muted)">CHECK</text>
    <text class="ui body" x="164" y="138" fill="var(--ink)">Local streaming speech model</text>
    <path d="M42 164H540" stroke="var(--hair)" />

    <g class="result">
      <text class="ui label" x="42" y="218" fill="var(--muted)">RETURN</text>
      <text class="ui answer" x="164" y="220" fill="var(--ink)">Live English captions</text>
    </g>

    <path d="M0 264H540" stroke="var(--hair)" />
    <circle cx="4" cy="301" r="6" fill="var(--live)" />
    <text class="ui note" x="24" y="307" fill="var(--blue-body)">No account, analytics, or transcript history.</text>
    <text class="ui note" x="24" y="339" fill="var(--blue-body)">No application server.</text>
  </g>

  <text class="ui brand" x="30" y="850" fill="var(--muted)">LAYTH QASSEM, PHARMD, MS</text>
</svg>
