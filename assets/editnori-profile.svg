<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Editnori by Layth Qassem</title>
  <desc id="desc">Active Chrome tab audio becomes live English captions because Moonshine processes the stream inside the browser. The same build path turns an input into a checked, usable result.</desc>
  <style>
    svg {
      --paper: #F6F6F4;
      --ink: #161617;
      --blue: #3155B4;
      --blue-body: #52689F;
      --coral: #FF8C66;
      --live: #36C26E;
      --muted: #5E5E62;
      --hair: #D8D8D5;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #161617;
        --ink: #F2F2F0;
        --blue: #7C9BFF;
        --blue-body: #94A8E2;
        --coral: #FF9A78;
        --live: #43D97F;
        --muted: #B8B8BC;
        --hair: #38383B;
      }
    }
    .ui { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 1.8px; }
    .question { font-size: 16px; font-weight: 500; }
    .display { font-size: 45px; font-weight: 600; letter-spacing: -1.1px; }
    .answer { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
    .body { font-size: 15px; font-weight: 400; }
    .path-line { stroke-dasharray: 180; stroke-dashoffset: 0; animation: reveal 320ms var(--ease-out) both; }
    .result { animation: arrive 320ms 120ms var(--ease-out) both; }
    @keyframes reveal { from { stroke-dashoffset: 180; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .path-line, .result { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="438" rx="16" fill="var(--paper)" stroke="var(--blue)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7" />
  <path d="M670 32V408" stroke="var(--hair)" />
  <path d="M28 68H1172" stroke="var(--hair)" />

  <text class="ui label" x="42" y="45" fill="var(--ink)">EDITNORI</text>
  <text class="ui label" x="1158" y="45" text-anchor="end" fill="var(--blue)">CLINICAL INFORMATICS · LOCAL SOFTWARE</text>

  <g transform="translate(48 110)">
    <text class="ui question" x="0" y="0" fill="var(--muted)">What does one input become?</text>
    <text class="ui display" x="0" y="68" fill="var(--blue)">Tab audio becomes</text>
    <text class="ui display" x="0" y="120" fill="var(--ink)">live English captions.</text>
    <path d="M2 143C120 164 250 135 400 151" fill="none" stroke="var(--coral)" stroke-width="3" stroke-linecap="round" />
    <text class="ui body" x="0" y="188" fill="var(--blue-body)">Moonshine processes the stream inside the browser, so the</text>
    <text class="ui body" x="0" y="213" fill="var(--blue-body)">audio and transcript text stay there.</text>
  </g>

  <text class="ui label" x="48" y="400" fill="var(--muted)">LAYTH QASSEM, PHARMD, MS</text>

  <g transform="translate(716 104)">
    <text class="ui label" x="0" y="0" fill="var(--blue)">THE BUILD PATH</text>

    <path class="path-line" d="M10 42V216" stroke="var(--hair)" stroke-width="2" />
    <circle cx="10" cy="55" r="6" fill="var(--blue)" />
    <circle cx="10" cy="133" r="6" fill="var(--coral)" />
    <circle class="result" cx="10" cy="211" r="6" fill="var(--live)" />

    <text class="ui label" x="36" y="50" fill="var(--muted)">INPUT</text>
    <text class="ui body" x="36" y="73" fill="var(--ink)">Active Chrome tab audio</text>
    <path d="M36 92H430" stroke="var(--hair)" />

    <text class="ui label" x="36" y="128" fill="var(--muted)">CHECK</text>
    <text class="ui body" x="36" y="151" fill="var(--ink)">Local streaming speech model</text>
    <path d="M36 170H430" stroke="var(--hair)" />

    <g class="result">
      <text class="ui label" x="36" y="206" fill="var(--muted)">RETURN</text>
      <text class="ui answer" x="36" y="234" fill="var(--ink)">Live English captions</text>
    </g>

    <path d="M0 264H430" stroke="var(--hair)" />
    <circle cx="4" cy="298" r="5" fill="var(--live)" />
    <text class="ui body" x="22" y="303" fill="var(--blue-body)">No account, analytics, transcript history, or app server.</text>
  </g>
</svg>
