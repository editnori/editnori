<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Editnori by Layth Qassem</title>
  <desc id="desc">Active Chrome tab audio becomes live English captions because Moonshine processes the stream inside the browser. The same build path turns an input into a checked, usable result.</desc>
  <style>
    svg {
      --paper: #F6F6F4;
      --ink: #161617;
      --blue: #3155B4;
      --blue-body: #52689F;
      --coral: #FF8C66;
      --live: #36C26E;
      --muted: #5E5E62;
      --hair: #D8D8D5;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #161617;
        --ink: #F2F2F0;
        --blue: #7C9BFF;
        --blue-body: #94A8E2;
        --coral: #FF9A78;
        --live: #43D97F;
        --muted: #B8B8BC;
        --hair: #38383B;
      }
    }
    .ui { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 1.6px; }
    .question { font-size: 17px; font-weight: 500; }
    .display { font-size: 38px; font-weight: 600; letter-spacing: -0.8px; }
    .answer { font-size: 22px; font-weight: 600; letter-spacing: -0.2px; }
    .body { font-size: 18px; font-weight: 400; }
    .note { font-size: 16px; font-weight: 400; }
    .path-line { stroke-dasharray: 180; stroke-dashoffset: 0; animation: reveal 320ms var(--ease-out) both; }
    .result { animation: arrive 320ms 120ms var(--ease-out) both; }
    @keyframes reveal { from { stroke-dashoffset: 180; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .path-line, .result { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="998" height="418" rx="14" fill="var(--paper)" stroke="var(--blue)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7" />
  <path d="M560 28V392" stroke="var(--hair)" />
  <path d="M28 64H972" stroke="var(--hair)" />

  <text class="ui label" x="36" y="42" fill="var(--ink)">EDITNORI</text>
  <text class="ui label" x="964" y="42" text-anchor="end" fill="var(--blue)">CLINICAL INFORMATICS · LOCAL SOFTWARE</text>

  <g transform="translate(40 108)">
    <text class="ui question" x="0" y="0" fill="var(--muted)">What does one input become?</text>
    <text class="ui display" x="0" y="58" fill="var(--blue)">Tab audio becomes</text>
    <text class="ui display" x="0" y="104" fill="var(--ink)">live English captions.</text>
    <path d="M2 128C104 149 226 120 360 136" fill="none" stroke="var(--coral)" stroke-width="3" stroke-linecap="round" />
    <text class="ui body" x="0" y="171" fill="var(--blue-body)">Moonshine processes the stream inside the browser, so</text>
    <text class="ui body" x="0" y="198" fill="var(--blue-body)">the audio and transcript text stay there.</text>
  </g>

  <text class="ui label" x="40" y="382" fill="var(--muted)">LAYTH QASSEM, PHARMD, MS</text>

  <g transform="translate(600 90)">
    <text class="ui label" x="0" y="0" fill="var(--blue)">THE BUILD PATH</text>

    <path class="path-line" d="M10 40V214" stroke="var(--hair)" stroke-width="2" />
    <circle cx="10" cy="52" r="6" fill="var(--blue)" />
    <circle cx="10" cy="130" r="6" fill="var(--coral)" />
    <circle class="result" cx="10" cy="208" r="6" fill="var(--live)" />

    <text class="ui label" x="36" y="47" fill="var(--muted)">INPUT</text>
    <text class="ui body" x="36" y="72" fill="var(--ink)">Active Chrome tab audio</text>
    <path d="M36 90H364" stroke="var(--hair)" />

    <text class="ui label" x="36" y="125" fill="var(--muted)">CHECK</text>
    <text class="ui body" x="36" y="150" fill="var(--ink)">Local streaming speech model</text>
    <path d="M36 168H364" stroke="var(--hair)" />

    <g class="result">
      <text class="ui label" x="36" y="203" fill="var(--muted)">RETURN</text>
      <text class="ui answer" x="36" y="232" fill="var(--ink)">Live English captions</text>
    </g>

    <path d="M0 258H364" stroke="var(--hair)" />
    <circle cx="4" cy="282" r="5" fill="var(--live)" />
    <text class="ui note" x="22" y="287" fill="var(--blue-body)">No account, analytics, or transcript history.</text>
    <text class="ui note" x="22" y="310" fill="var(--blue-body)">No application server.</text>
  </g>
</svg>
